name: Build Android (.apk) e release

# Publica o APK automaticamente quando uma tag v* é enviada (ex.: v0.2.1).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true

      - name: Install dependencies and verify
        working-directory: app
        run: |
          flutter pub get
          flutter analyze

      - name: Build APK (release)
        working-directory: app
        run: flutter build apk --release

      - name: Prepare artifact
        run: cp app/build/app/outputs/flutter-apk/app-release.apk resong-android.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: resong ${{ github.ref_name }}
          files: resong-android.apk
          generate_release_notes: true
