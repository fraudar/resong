name: Build iOS (.ipa)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "app/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true

      - name: Install dependencies and verify
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build unsigned iOS app bundle
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package IPA (unsigned for AltStore / SideStore / Sideloadly)
        run: |
          mkdir -p build_ipa/Payload
          cp -R app/build/ios/iphoneos/Runner.app build_ipa/Payload/
          cd build_ipa
          zip -qr ../resong-ios-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: resong-ios-unsigned-ipa
          path: resong-ios-unsigned.ipa
